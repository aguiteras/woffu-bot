services:
  woffu-slack-bot:
    build: .
    container_name: woffu-slack-bot
    restart: unless-stopped

    environment:
      SLACK_TOKEN: "${SLACK_TOKEN}"
      BOT_BASE_URL: "${BOT_BASE_URL}"
      WOFFU_BASE_URL: "${WOFFU_BASE_URL}"
      PORT: "${PORT}"

    volumes:
      - woffu-bot-data:/data

    networks:
      - traefik-proxy

    labels:
      - "traefik.enable=true"

      # Router HTTPS
      - "traefik.http.routers.woffu-bot.rule=Host(`${WOFFU_HOST}`)"
      - "traefik.http.routers.woffu-bot.entrypoints=websecure"
      - "traefik.http.routers.woffu-bot.tls.certresolver=le"

      # Router HTTP -> HTTPS
      - "traefik.http.routers.woffu-bot-redirect.rule=Host(`${WOFFU_HOST}`)"
      - "traefik.http.routers.woffu-bot-redirect.entrypoints=web"
      - "traefik.http.routers.woffu-bot-redirect.middlewares=redirect-to-https"

      # Middleware HTTP -> HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Port intern
      - "traefik.http.services.woffu-bot.loadbalancer.server.port=${PORT}"

volumes:
  woffu-bot-data:

networks:
  traefik-proxy:
    external: true
    name: traefik-proxy
